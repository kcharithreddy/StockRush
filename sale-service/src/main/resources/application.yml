server:
  port: ${PORT:8081}
  shutdown: graceful
  tomcat:
    # Room to queue a burst of new connections instead of dropping them.
    accept-count: 1000
    # Nginx keeps upstream connections open; do not force it to reconnect every 100 requests.
    max-keep-alive-requests: 100000
    keep-alive-timeout: 60s
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: sale-service
  config:
    # Local runs read secrets from the repo's .env (from the repo root or the service folder).
    # In Docker the same values arrive as real environment variables.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # This service's own Redis user (infra/redis/users.acl.template), never the operator account.
      username: sale-service
      password: ${REDIS_SALE_PASSWORD}
      # Fail fast: a buy request must never hang on a sick Redis.
      timeout: 1s
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Idempotent producer: retries never duplicate a record.
        enable.idempotence: true
        # Fail fast instead of blocking a request thread for 60 s when no broker is reachable.
        max.block.ms: 2000
        # Upper bound on when a send's final result is known (drives late compensation).
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        # Adds the request's request_id to every record (see RequestIdProducerInterceptor).
        interceptor.classes: com.flashsale.sale.logging.RequestIdProducerInterceptor

flashsale:
  security:
    # Tokens must carry exactly this issuer (Keycloak's public URL, see KC_HOSTNAME in docker-compose.yml)
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/stockrush}
    # Where to fetch Keycloak's signing keys; inside Docker this is the internal keycloak:8080 address.
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/stockrush/protocol/openid-connect/certs}
    audience: stockrush-api
    # Load tests only: when set (32+ characters), tokens from the "stockrush-loadtest" issuer signed
    # with this HMAC secret are also accepted. Never set in a normal deployment.
    loadtest-secret: ${LOADTEST_JWT_SECRET:}

management:
  # Health and metrics live on a separate port that is never published outside the Docker network.
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    # Plain-text logs (local runs) show the request id too. Docker switches to JSON (ECS), see docker-compose.yml.
    correlation: "[%X{request_id:-}] "

