server:
  port: ${PORT:8081}

spring:
  application:
    name: sale-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Idempotent producer: retries never duplicate a record.
        enable.idempotence: true
        # Fail fast instead of blocking a request thread for 60 s when no broker is reachable.
        max.block.ms: 2000
        # Upper bound on when a send's final result is known (drives late compensation).
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
