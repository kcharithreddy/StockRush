name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [sale-service, order-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B -ntp verify

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  alerts:
    name: Test alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check and unit-test Prometheus rules
        run: |
          docker run --rm -v "$PWD/infra/alerting:/rules:ro" -w /rules --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/infra/alerting:/rules:ro" -w /rules --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/infra/alerting:/c:ro" --entrypoint /bin/amtool \
            prom/alertmanager:v0.28.1 check-config /c/alertmanager.yml

