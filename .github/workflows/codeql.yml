name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # Fetch Maven (checksum-verified by the wrapper) before CodeQL starts tracing. Under the tracer the
      # wrapper's download fails, which only shows when the Maven cache misses (for example after a pom change).
      - name: Download Maven
        run: |
          (cd sale-service && ./mvnw -B -ntp -v)
          (cd order-service && ./mvnw -B -ntp -v)

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          (cd sale-service && ./mvnw -B -ntp -DskipTests package)
          (cd order-service && ./mvnw -B -ntp -DskipTests package)

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
