version: 2
updates:
  - package-ecosystem: maven
    directory: /sale-service
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    # Stay on Spring Boot 3.x (ARCHITECTURE.md §2); major upgrades are a deliberate decision.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /order-service
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
