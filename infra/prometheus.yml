global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Actuator runs on the internal management ports, which are never published.
  - job_name: sale-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sale-1:9080", "sale-2:9080"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:9091"]
