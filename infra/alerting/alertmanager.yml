# Alertmanager: groups and routes alerts from Prometheus. View them at http://localhost:9093.
#
# No receiver sends anything yet: there is nowhere to send to on a developer machine. To page someone,
# add a receiver here (Slack, e-mail, PagerDuty, a webhook) — keep its secret out of git, e.g. with
# `slack_api_url_file` pointing at a mounted secret file — and route `severity="critical"` to it.
route:
  receiver: operators
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: operators
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: operators

inhibit_rules:
  # When a service is down, its error-rate and latency alerts are noise.
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [severity="warning"]
    equal: [job]
