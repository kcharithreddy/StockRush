worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    access_log off;

    # Per-IP limit on the buy endpoint (ARCHITECTURE.md §11).
    # The limit itself is applied from nginx-ratelimit.conf, included in the buy location below.
    # Load tests swap that file for an empty one (docker-compose.loadtest.yml): all k6 traffic comes from one IP.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
    limit_req_status 429;

    # Nothing here takes a request body, so anything larger is refused early.
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;

    # Docker's DNS. With `resolve`, Nginx starts (and keeps running) even while an instance is down,
    # and picks up a restarted container's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream sale_pool {
        zone sale_pool 64k;
        # Round-robin. An instance is skipped for 5 s after 3 failed connects, so one slow accept
        # during a spike cannot take both instances out of rotation.
        server sale-1:8080 max_fails=3 fail_timeout=5s resolve;
        server sale-2:8080 max_fails=3 fail_timeout=5s resolve;
        # Reuse upstream connections: a spike must not turn into a storm of new TCP connects.
        keepalive 512;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    upstream order_api {
        zone order_api 64k;
        server order-service:8090 resolve;
        keepalive 64;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    # Only retry on a failed connect: a POST that reached an instance is never sent twice.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    server {
        listen 8080;

        location ~ ^/sales/[0-9]+/buy$ {
            include /etc/nginx/ratelimit.conf;
            limit_except POST { deny all; }
            proxy_pass http://sale_pool;
        }

        location ~ ^/sales/[0-9]+/stock$ {
            limit_except GET { deny all; }
            proxy_pass http://sale_pool;
        }

        location ~ "^/orders/[0-9a-fA-F-]{36}(/pay)?$" {
            proxy_pass http://order_api;
        }

        # Everything else, including /admin/** and /actuator/**, is not routed.
        location / {
            return 404;
        }
    }
}
