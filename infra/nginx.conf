worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    # Correct Content-Type for the shop page's files: with nosniff, a script sent as text/plain never runs.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One JSON line per request, with the id that is passed to the services and returned to the client.
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
                                '"method":"$request_method","uri":"$uri","status":$status,'
                                '"duration_s":$request_time,"upstream":"$upstream_addr","upstream_s":"$upstream_response_time"}';
    access_log /dev/stdout json buffer=64k flush=1s;

    # Per-IP limit on the buy endpoint (ARCHITECTURE.md §11).
    # The limit itself is applied from nginx-ratelimit.conf, included in the buy location below.
    # Load tests swap that file for an empty one (docker-compose.loadtest.yml): all k6 traffic comes from one IP.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
    limit_req_status 429;

    # Nothing here takes a request body, so anything larger is refused early.
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;

    # HSTS covers a host name on every port, so sending it for localhost would force the browser onto HTTPS for
    # every local dev server (Grafana on :3000, Keycloak on :8180, ...). Only real host names get it.
    map $host $hsts {
        localhost   "";
        127.0.0.1   "";
        default     "max-age=31536000";
    }

    # The shop page (web/) is the only HTML served. Its policy allows scripts and styles from this server only,
    # and network calls only to this server and Keycloak (the issuer in web/index.html and KC_HOSTNAME).
    # Every other response is API JSON and gets a policy that allows nothing at all.
    map $uri $csp {
        "~^/(index\.html|app\.js|app\.css|favicon\.svg)?$"
            "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http://localhost:8180; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
        default "default-src 'none'; frame-ancestors 'none'";
    }

    # Revalidate the page's files on every load, so a new version shows up at once. Empty (no header) for the API.
    map $uri $page_cache {
        "~^/(index\.html|app\.js|app\.css|favicon\.svg)?$" "no-cache";
        default "";
    }

    # Docker's DNS. With `resolve`, Nginx starts (and keeps running) even while an instance is down,
    # and picks up a restarted container's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream sale_pool {
        zone sale_pool 64k;
        # Round-robin. An instance is skipped for 5 s after 3 failed connects, so one slow accept
        # during a spike cannot take both instances out of rotation.
        server sale-1:8080 max_fails=3 fail_timeout=5s resolve;
        server sale-2:8080 max_fails=3 fail_timeout=5s resolve;
        # Reuse upstream connections: a spike must not turn into a storm of new TCP connects.
        keepalive 512;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    upstream order_api {
        zone order_api 64k;
        server order-service:8090 resolve;
        keepalive 64;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Always Nginx's own id: a client cannot choose the id its request is logged under.
    proxy_set_header X-Request-Id $request_id;
    add_header X-Request-Id $request_id always;
    proxy_hide_header X-Request-Id;
    # Nginx sets these for every response; drop the services' copies so each header appears once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    # Only retry on a failed connect: a POST that reached an instance is never sent twice.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    # Plain HTTP only redirects. 308 keeps the method and body, so a POST stays a POST.
    server {
        listen 8080;
        location / {
            return 308 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Nothing may be framed or sniffed, and browsers must stay on HTTPS. The CSP depends on the path (map above).
        # Empty for localhost (see the map above): Nginx then omits the header entirely.
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control $page_cache;
        # add_header in a server block replaces the http-level ones, so repeat the request id here.
        add_header X-Request-Id $request_id always;

        location ~ ^/sales/[0-9]+/buy$ {
            include /etc/nginx/ratelimit.conf;
            limit_except POST { deny all; }
            proxy_pass http://sale_pool;
        }

        # Waiting room: join (POST) and poll for one's place (GET).
        location ~ ^/sales/[0-9]+/queue$ {
            include /etc/nginx/ratelimit.conf;
            limit_except GET POST { deny all; }
            proxy_pass http://sale_pool;
        }

        location ~ ^/sales/[0-9]+/stock$ {
            limit_except GET { deny all; }
            proxy_pass http://sale_pool;
        }

        location ~ "^/orders/[0-9a-fA-F-]{36}(/pay)?$" {
            proxy_pass http://order_api;
        }

        # The shop page: static files from web/, read-only.
        location = / {
            limit_except GET { deny all; }
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location ~ ^/(app\.js|app\.css|favicon\.svg)$ {
            limit_except GET { deny all; }
            root /usr/share/nginx/html;
        }

        # Everything else, including /admin/** and /actuator/**, is not routed.
        location / {
            return 404;
        }
    }
}
