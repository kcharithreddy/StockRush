server:
  port: 8090
  shutdown: graceful
  tomcat:
    # Room to queue a burst of new connections instead of dropping them.
    accept-count: 1000
    # Nginx keeps upstream connections open; do not force it to reconnect every 100 requests.
    max-keep-alive-requests: 100000
    keep-alive-timeout: 60s
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: order-service
  config:
    # Local runs read secrets from the repo's .env (from the repo root or the service folder).
    # In Docker the same values arrive as real environment variables.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/flashsale
    # Least-privilege role (infra/db-init/02-app-user.sh), never the Postgres superuser.
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Wait up to 60 s for PostgreSQL at startup instead of failing at once. Compose orders startup only on
      # `docker compose up`; after a Docker or host restart all containers come back together, and without this
      # order-service crash-looped until PostgreSQL accepted connections.
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # This service's own Redis user (infra/redis/users.acl.template), never the operator account.
      username: order-service
      password: ${REDIS_ORDER_PASSWORD}
      timeout: 1s
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA:localhost:9092}
    listener:
      # Continues the buyer's trace from the event's traceparent header into the order write.
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Used only to park unprocessable records on order-created.DLT and to replay them.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

orders:
  payment-timeout-minutes: 10

flashsale:
  admin:
    # POST /admin/sales/{id}/reset deletes orders. Off unless explicitly enabled (local testing only).
    reset-enabled: ${RESET_ENABLED:false}
  security:
    # Tokens must carry exactly this issuer (Keycloak's public URL, see KC_HOSTNAME in docker-compose.yml)
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/stockrush}
    # Where to fetch Keycloak's signing keys; inside Docker this is the internal keycloak:8080 address.
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/stockrush/protocol/openid-connect/certs}
    audience: stockrush-api
    # Load tests only: when set (32+ characters), tokens from the "stockrush-loadtest" issuer signed
    # with this HMAC secret are also accepted. Never set in a normal deployment.
    loadtest-secret: ${LOADTEST_JWT_SECRET:}
  assistant:
    # Ops assistant (POST /admin/assistant/summary). Off unless OPENAI_API_KEY is set in .env.
    # It sends aggregates only (see OpsFacts); GET /admin/assistant/facts shows exactly what would be sent.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    alertmanager-url: ${ALERTMANAGER_URL:http://localhost:9093}
    # Cost guard: at most one AI call per interval.
    min-interval: 30s
    timeout: 30s

management:
  # Health and metrics live on a separate port that is never published outside the Docker network.
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # Share of requests traced: all of them by default; load tests lower it (TRACING_SAMPLING).
      probability: ${TRACING_SAMPLING:1.0}
    export:
      # Off unless a collector is configured, so local runs and tests do not try to reach one.
      # docker-compose.yml turns it on and points it at Grafana Tempo.
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics stay pull-based on /actuator/prometheus; the OpenTelemetry starter would also push them via OTLP.
        enabled: false
  logging:
    export:
      otlp:
        # Logs go to stdout as JSON, not over OTLP.
        enabled: false

# Database spans (datasource-micrometer): one span per SQL statement. The statement text uses ? placeholders;
# parameter values (user ids, order tokens) are never recorded.
jdbc:
  includes: QUERY

logging:
  pattern:
    # Plain-text logs (local runs) show the request id and trace id too. Docker switches to JSON (ECS), see docker-compose.yml.
    correlation: "[%X{request_id:-} %X{traceId:-}] "

