name: stockrush

# Secrets come from .env (copy .env.example, never commit .env).
# Only Nginx is published on all interfaces; everything else is bound to 127.0.0.1 or not published.
# Build the jars before `docker compose up --build`:
#   (cd sale-service && ./mvnw -DskipTests package) && (cd order-service && ./mvnw -DskipTests package)

x-app-hardening: &app-hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  stop_grace_period: 25s

x-sale-service: &sale-service
  <<: *app-hardening
  build: ./sale-service
  image: stockrush/sale-service:local
  environment:
    PORT: 8080
    MANAGEMENT_PORT: 9080
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    KAFKA: kafka:29092
  depends_on:
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:9080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flashsale
      # Least-privilege role the services connect as (created by infra/db-init/02-app-user.sh).
      APP_DB_USER: ${DB_USER:?set DB_USER in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/db-init/02-app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Lets `docker compose exec redis redis-cli` authenticate without typing the password.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (NewTopic bean), never by a stray producer or consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  sale-1:
    <<: *sale-service

  sale-2:
    <<: *sale-service

  order-service:
    <<: *app-hardening
    build: ./order-service
    image: stockrush/order-service:local
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      KAFKA: kafka:29092
      DB_HOST: postgres
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      RESET_ENABLED: ${RESET_ENABLED:-false}
      ORDERS_PAYMENT_TIMEOUT_MINUTES: ${PAYMENT_TIMEOUT_MINUTES:-10}
    ports:
      # Admin endpoints live here and are unauthenticated until Step B: host only.
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sale-1:
        condition: service_healthy
      sale-2:
        condition: service_healthy
      order-service:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
